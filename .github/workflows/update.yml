name: Update Predictions
on:
  schedule:
    - cron: '0 8 *'  # 11:00 Maputo = 08:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Run update script
      env:
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        pip install requests
        python update.py
    - name: Commit changes
      run: |
        git config --global user.name 'bot'
        git config --global user.email 'bot@suretiops.com'
        git add dados.json
        git commit -m "Update predictions" || exit 0
        git push
